<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Redirecting…</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Instant redirect without JavaScript -->
  <meta http-equiv="refresh" content="0; url=https://frederikgoebel.github.io/makeapot/">
  <link rel="canonical" href="https://frederikgoebel.github.io/makeapot/">
  <!-- Instant redirect with JavaScript (replace keeps the back button clean) -->
  <script>
    window.location.replace("https://frederikgoebel.github.io/makeapot/");
  </script>
  <style>
    body {
      font-family: system-ui, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      text-align: center;
    }
  </style>
</head>
<body>
  <p>
    This page has moved.<br>
    If you are not redirected automatically,
    <a href="https://frederikgoebel.github.io/makeapot/">click here to go to makeapot</a>.
  </p>
</body>
</html>
